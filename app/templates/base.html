<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CheckStock{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background: #f6f7f9;
      color: #1f2933;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 16px; font-size: 28px; }
    h2 { margin: 32px 0 12px; font-size: 20px; }
    .actions { margin: 0 0 20px; display: flex; flex-wrap: wrap; gap: 8px; }
    .actions a {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 6px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .actions a:hover { opacity: 0.9; }
    .btn-inbound { background: #2c7a4b; }
    .btn-fbs { background: #1f5fa8; }
    .btn-transfer { background: #8a5a1f; }
    .btn-fbo { background: #6a2c8a; }
    .btn-warehouses { background: #444; }
    .btn-products { background: #444; }

    table {
      border-collapse: collapse;
      width: 100%;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      margin-bottom: 8px;
    }
    th, td {
      padding: 10px 12px;
      text-align: right;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }
    th { background: #f3f4f6; font-weight: 600; }
    th:first-child, td:first-child { text-align: left; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }
    .zero { color: #9ca3af; }
    .archived { color: #9ca3af; font-style: italic; }
    table.where td:nth-child(2),
    table.where th:nth-child(2) {
      text-align: left;
    }

    form.inline { display: inline-block; margin: 0; }
    input[type="text"], input[type="number"], select {
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    button, .btn-action {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #1f2933;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover, .btn-action:hover { background: #f3f4f6; }
    .btn-action { text-decoration: none; display: inline-block; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-confirmed { background: #d1fae5; color: #065f46; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }
    .badge-transit { background: #dbeafe; color: #1e40af; }
    .badge-received { background: #d1fae5; color: #065f46; }

    .error {
      color: #991b1b;
      background: #fee2e2;
      padding: 10px 14px;
      border-radius: 6px;
      margin: 12px 0;
    }
    .hint { color: #6b7280; font-size: 13px; }
    .muted { color: #9ca3af; }
  </style>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
